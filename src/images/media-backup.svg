<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mbBg" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#0175C2"/>
    </linearGradient>
    <linearGradient id="mbScreen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0c1730"/>
      <stop offset="1" stop-color="#132649"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#mbBg)"/>
  <g opacity="0.12" fill="#ffffff">
    <circle cx="70" cy="60" r="4"/>
    <circle cx="520" cy="40" r="3"/>
    <circle cx="560" cy="300" r="5"/>
    <circle cx="40" cy="330" r="3"/>
  </g>

  <!-- Cloud -->
  <g transform="translate(360,60)">
    <path d="M40 60 a34 34 0 0 1 66 -10 a26 26 0 0 1 8 51 H36 a24 24 0 0 1 4 -41 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M74 78 v34 M74 78 l-14 14 M74 78 l14 14" stroke="#0175C2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Phone as server -->
  <g transform="translate(120,120)">
    <rect x="0" y="0" width="150" height="240" rx="22" fill="#0b1220"/>
    <rect x="10" y="10" width="130" height="220" rx="14" fill="url(#mbScreen)"/>
    <!-- photo grid -->
    <g>
      <rect x="24" y="28" width="46" height="46" rx="6" fill="#00ADD8"/>
      <rect x="80" y="28" width="46" height="46" rx="6" fill="#4dd0e1"/>
      <rect x="24" y="84" width="46" height="46" rx="6" fill="#5c6bc0"/>
      <rect x="80" y="84" width="46" height="46" rx="6" fill="#26c6da"/>
      <rect x="24" y="140" width="46" height="46" rx="6" fill="#42a5f5"/>
      <rect x="80" y="140" width="46" height="46" rx="6" fill="#00ADD8"/>
    </g>
    <!-- sun in one tile -->
    <circle cx="47" cy="45" r="8" fill="#ffe082"/>
    <rect x="24" y="196" width="102" height="10" rx="5" fill="#26374d"/>
    <circle cx="75" cy="222" r="7" fill="#26374d"/>
  </g>

  <!-- upload arrows between phone and cloud -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9" fill="none">
    <path d="M290 210 q60 -30 110 -70"/>
    <path d="M382 150 l18 -10 l2 20"/>
  </g>

  <!-- title -->
  <text x="40" y="378" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Self-Hosted Media Backup</text>
</svg>
