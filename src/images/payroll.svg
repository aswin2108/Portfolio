    <!-- rows -->
    <rect x="24" y="70" width="120" height="12" rx="6" fill="#d7d2f2"/>
    <rect x="24" y="98" width="182" height="10" rx="5" fill="#eceaf7"/>
    <rect x="24" y="122" width="182" height="10" rx="5" fill="#eceaf7"/>
    <rect x="24" y="146" width="120" height="10" rx="5" fill="#eceaf7"/>
